name: REST API Automation Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Daily regression test run at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  api-tests:
    name: Run Pytest REST API Automation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Smoke Tests
        run: |
          pytest -m smoke --html=reports/smoke_report.html --self-contained-html

      - name: Execute Full Regression & Negative Suite
        if: always()
        run: |
          pytest --html=reports/regression_report.html --self-contained-html

      - name: Archive Test Execution Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-execution-reports
          path: reports/
          retention-days: 14
