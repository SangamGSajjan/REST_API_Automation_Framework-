[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    -q
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --capture=tee-sys

markers =
    smoke: Quick sanity tests for critical paths (run with '-m smoke')
    regression: Comprehensive regression suite covering functional & edge cases
    auth: Authentication and token generation tests
    crud: Create, Read, Update, Delete booking lifecycle tests
    filter: Search, query parameter, and Data-Driven tests
    negative: Negative, security, and boundary validation tests
    db: Backend database validation tests using SQL queries
    slow: Tests that might take longer due to network retries

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)d)
log_cli_date_format = %Y-%m-%d %H:%M:%S
